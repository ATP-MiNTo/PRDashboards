query OpenPullRequests($q: String!, $cursor: String) {
  rateLimit {
    limit
    cost
    remaining
    resetAt
  }
  search(query: $q, type: ISSUE, first: 50, after: $cursor) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      __typename
      ... on PullRequest {
        id
        number
        title
        url
        isDraft
        mergeable
        mergeStateStatus
        reviewDecision
        headRefName
        headRefOid
        baseRefName
        repository {
          id
          nameWithOwner
          squashMergeAllowed
          mergeCommitAllowed
          rebaseMergeAllowed
        }
        commits(last: 1) {
          nodes {
            commit {
              committedDate
              statusCheckRollup {
                state
                contexts(first: 50) {
                  totalCount
                  nodes {
                    __typename
                    ... on CheckRun {
                      name
                      status
                      conclusion
                      detailsUrl
                      startedAt
                      completedAt
                      checkSuite {
                        app {
                          name
                        }
                      }
                    }
                    ... on StatusContext {
                      context
                      state
                      targetUrl
                      createdAt
                    }
                  }
                }
              }
            }
          }
        }
        latestReviews(first: 10) {
          nodes {
            id
            state
            submittedAt
            author {
              login
            }
          }
        }
        reviewRequests(first: 10) {
          nodes {
            requestedReviewer {
              __typename
              ... on User {
                id
              }
              ... on Team {
                id
              }
            }
          }
        }
      }
    }
  }
}
