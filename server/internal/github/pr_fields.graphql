fragment PullRequestFields on PullRequest {
  id
  number
  state
  title
  url
  isDraft
  mergeable
  mergeStateStatus
  reviewDecision
  headRefName
  headRefOid
  isCrossRepository
  baseRefName
  updatedAt
  additions
  deletions
  author {
    login
  }
  repository {
    id
    nameWithOwner
    squashMergeAllowed
    mergeCommitAllowed
    rebaseMergeAllowed
    viewerPermission
  }
  commits(last: 1) {
    nodes {
      commit {
        committedDate
        statusCheckRollup {
          state
          contexts(first: 50) {
            totalCount
            nodes {
              __typename
              ... on CheckRun {
                name
                status
                conclusion
                detailsUrl
                startedAt
                completedAt
                checkSuite {
                  app {
                    name
                  }
                }
              }
              ... on StatusContext {
                context
                state
                targetUrl
                createdAt
              }
            }
          }
        }
      }
    }
  }
  latestReviews(first: 10) {
    nodes {
      id
      state
      submittedAt
      author {
        login
      }
    }
  }
  reviewRequests(first: 10) {
    nodes {
      requestedReviewer {
        __typename
        ... on User {
          id
        }
        ... on Team {
          id
        }
      }
    }
  }
}
